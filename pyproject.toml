[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinytorchprofiler"
version = "0.1.2"
description = "A lightweight PyTorch model profiler for latency, parameters, memory, and layer-wise bottlenecks."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Parth Pore" }
]
keywords = ["pytorch", "profiling", "machine-learning", "latency", "model-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch",
    "numpy",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["tinytorchprofiler*"]
